<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VigilantLink</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      background: #ffffff;
      color: #333;
      font-size: 14px;
    }
    .header {
      padding: 12px 16px;
      background: #dc3545;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header .logo { font-size: 18px; font-weight: bold; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .content { padding: 16px; }
    .current-site {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .current-site .label {
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .current-site .domain {
      font-weight: 600;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toggle-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .toggle-label { font-weight: 500; color: #555; }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    .toggle input:checked + .slider {
      background-color: #28a745;
    }
    .toggle input:checked + .slider:before {
      transform: translateX(18px);
    }
    .status {
      font-size: 11px;
      text-align: center;
      padding: 8px;
      border-top: 1px solid #eee;
      color: #28a745;
    }
    .status.disabled { color: #dc3545; }
    .preset-sites {
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 12px;
    }
    .preset-sites h3 {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .preset-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .preset-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .preset-item:last-child {
      border-bottom: none;
    }
    .preset-item .site-name {
      font-size: 12px;
      color: #555;
      flex: 1;
    }
    .preset-item .toggle {
      width: 36px;
      height: 20px;
    }
    .preset-item .slider:before {
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
    }
    .preset-item .toggle input:checked + .slider:before {
      transform: translateX(16px);
    }
    .custom-sites {
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 12px;
    }
    .custom-sites h3 {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .add-site-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
    }
    .add-site-form input {
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }
    .add-site-form .buttons {
      display: flex;
      gap: 6px;
    }
    .add-site-form button {
      flex: 1;
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-add {
      background: #dc3545;
      color: white;
    }
    .btn-add:hover { background: #c82333; }
    .btn-cancel {
      background: #6c757d;
      color: white;
    }
    .btn-cancel:hover { background: #5a6268; }
    .custom-site-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .custom-site-item:last-child {
      border-bottom: none;
    }
    .custom-site-item .site-info {
      flex: 1;
      overflow: hidden;
    }
    .custom-site-item .site-name {
      font-size: 12px;
      color: #333;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .custom-site-item .site-domain {
      font-size: 10px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .custom-site-item .remove {
      cursor: pointer;
      color: #dc3545;
      font-size: 14px;
      padding: 0 4px;
    }
    .show-add-form {
      width: 100%;
      padding: 8px;
      background: #f8f9fa;
      border: 1px dashed #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: #555;
      text-align: center;
      margin-top: 8px;
    }
    .show-add-form:hover {
      background: #e9ecef;
      border-color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">VL</div>
    <h1>VigilantLink</h1>
    <div id="settings-btn" style="margin-left: auto; cursor: pointer; font-size: 16px;" title="Settings">⚙️</div>
  </div>
  <div class="content">
    <div id="settings-panel" style="display: none; background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 16px; border: 1px solid #ddd;">
      <h3 style="font-size: 12px; color: #666; margin-bottom: 8px; text-transform: uppercase;">Backend Configuration</h3>
      <input type="text" id="backend-url-input" placeholder="http://127.0.0.1:8000/analyze" style="width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; margin-bottom: 8px;">
      <button id="save-settings-btn" style="width: 100%; padding: 6px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save Settings</button>
    </div>
    <div class="current-site">
      <div class="label" style="display: flex; justify-content: space-between; align-items: center;">
        <span>Current Site</span>
        <span id="site-status-badge" style="font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold;"></span>
      </div>
      <div class="domain" id="current-domain">Loading...</div>
    </div>
    <div class="toggle-section">
      <span class="toggle-label">Enable for this site</span>
      <label class="toggle">
        <input type="checkbox" id="site-toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="preset-sites">
      <h3>Quick Toggle</h3>
      <div class="preset-list" id="preset-list"></div>
    </div>
    <div class="custom-sites">
      <h3>Custom Sites</h3>
      <div class="add-site-form" id="add-form" style="display: none;">
        <input type="text" id="site-name-input" placeholder="Site name (e.g., My Bank)">
        <input type="text" id="site-domain-input" placeholder="Domain (e.g., bank.com)">
        <div class="buttons">
          <button class="btn-add" id="save-site-btn">Add</button>
          <button class="btn-cancel" id="cancel-btn">Cancel</button>
        </div>
      </div>
      <div class="custom-list" id="custom-list"></div>
      <div class="show-add-form" id="show-add-btn">+ Add Website</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
