version: '3.8'

services:
  vigilantlink-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilantlink-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app:ro
    # IPC host is recommended for Playwright to avoid shared memory issues
    ipc: host

  redis:
    image: redis:7-alpine
    container_name: vigilantlink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

volumes:
  redis_data:
